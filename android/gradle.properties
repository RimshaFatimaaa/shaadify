org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Performance optimizations
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
android.enableJetifier=true

# Fix for Kotlin incremental compilation issues with cross-drive paths (Windows)
kotlin.incremental=false
kotlin.incremental.js=false
kotlin.incremental.multiplatform=false